# SYNTHETIC/REFERENCE Balance Reconciliation Report fixture (spec 10.3.1, task 3.8).
#
# Reference data for deterministic parser, mapping and settlement tests only. It is not a report
# generated by any tenant's PayPal account and is not provider evidence (AC-REC-07). It holds no
# credentials and no personal or payment data: every identifier is invented.
#
# Columns follow the PayPal Balance Report naming for the fields the parser reads. `Settlement ID`
# is an added grouping column for the settlement fixture. Each row's treatment is the OPEN-10
# table in ../settlement_treatment.yaml; tests/test_brr_fixture.py fails when the file, its
# checksum or any stated treatment disagree.

file: SYNTHETIC_REFERENCE_balance_report_v1.csv
provenance: synthetic_reference
layout_basis: PayPal Balance Report CSV layout (spec 10.3.1)
version: "1"
sha256: 4e94a464e85fc97ccc2b5b6bbf2bdb9d6e41234be5673dae9f605c15f0528969
treatment_version: "1"
currency: USD
opening_balance: "500.00"
closing_balance: "508.75"

# Expected Net per settlement: fees already in Net are not subtracted again, the authorization
# moves no funds and the withdrawal is the bank-credit side, so neither counts.
expected_net:
  SYN-S-1: "116.38"

rows:
  - {transaction_id: SYN-CAP-1, event_code: T0006, category: CAPTURE, included_in_net: true}
  - {transaction_id: SYN-CAP-2, event_code: T0006, category: CAPTURE, included_in_net: true}
  - {transaction_id: SYN-AUTH-1, event_code: T1300, category: EXCLUDED, included_in_net: false}
  - {transaction_id: SYN-REF-1, event_code: T1107, category: REFUND, included_in_net: true}
  - {transaction_id: SYN-FEE-1, event_code: T0100, category: FEE, included_in_net: true}
  - {transaction_id: SYN-ADJ-1, event_code: T1900, category: ADJUSTMENT, included_in_net: true}
  - {transaction_id: SYN-CB-1, event_code: T1201, category: CHARGEBACK, included_in_net: true}
  - {transaction_id: SYN-WD-1, event_code: T0400, category: EXCLUDED, included_in_net: false}
