# Required safety suites, one per state-changing capability (spec 9.7.2). Packaged data: the
# attestation workflow runs exactly these pytest node IDs in the built image, and the signer
# refuses to issue while any category is empty or any listed test failed or was skipped
# (AC-REL-02). The verifier checks the suite ID and version an attestation names (check 9).
#
# Categories are the eight spec 9.7.2 names. Bump `version` whenever a list changes.
# List module-level test functions only: the signer matches JUnit class names to node IDs, so a
# test inside a class never counts. The harness holds backend/ only, so no listed test may read
# files outside it. tests/test_safety_suites.py checks both, and traces each criterion.
suites:
  # Task 5.17: AC-PP-08, AC-PLY-02, the PB-002 parts of AC-PLY-08, AC-EXEC-MODE-03.
  - capability: refunds.create
    connector_id: paypal
    suite_id: paypal-refunds-create
    version: 2
    categories:
      authorization_enforcement:
        - tests/test_pb002.py::test_pb002_definition_always_requires_approval
        - tests/test_pb002.py::test_pb002_needs_approval_even_when_the_tenant_says_otherwise
        - tests/test_playbook_gateway.py::test_the_requester_cannot_decide_their_own_request
        - tests/test_worker.py::test_the_grant_keys_are_worker_only
        - tests/test_worker.py::test_a_human_session_is_refused_before_any_side_effect
        - tests/test_route_guard.py::test_human_is_rejected_by_the_worker_route
        - tests/test_paypal_g4.py::test_paypal_client_refuses_non_sandbox_host
      tenant_isolation:
        - tests/test_worker_refunds.py::test_the_client_comes_only_from_the_tenants_own_paypal_source
        - tests/test_release_attestation.py::test_neither_capabilitys_attestation_authorizes_the_other_or_another_tenant
        - tests/test_playbook_gateway.py::test_another_tenant_cannot_read_or_approve_the_request
        - tests/test_worker.py::test_a_grant_is_bound_to_its_execution_and_tenant
        - tests/test_execution_mode.py::test_another_tenants_live_row_is_invisible
      transitions:
        - tests/test_pb002.py::test_equal_amounts_on_two_orders_are_not_a_duplicate
        - tests/test_pb002.py::test_pb002_is_ineligible_without_the_full_proof
        - tests/test_pb002.py::test_three_captures_are_ambiguous
        - tests/test_pb002.py::test_pb002_refunds_the_later_capture_in_full
        - tests/test_pb002.py::test_the_original_is_decided_by_paypals_capture_time_not_by_order_of_ids
        - tests/test_pb002.py::test_a_capture_paypal_has_not_completed_blocks_the_refund
        - tests/test_pb002.py::test_completion_from_a_non_paypal_authority_is_not_enough
        - tests/test_paypal_g4.py::test_ac_ply_02_duplicate_capture_proof
        - tests/test_paypal_g4.py::test_refunds_refuses_invalid_amount_or_currency
        - tests/test_worker.py::test_python_and_database_allow_the_same_execution_transitions
      idempotency:
        - tests/test_worker_refunds.py::test_an_ambiguous_refund_is_settled_under_the_same_request_id
        - tests/test_paypal_g4.py::test_ac_pp_12_refunds_adapter_contract
        - tests/test_playbook_gateway.py::test_a_repeated_key_returns_the_prior_request
        - tests/test_execution_chain.py::test_one_execution_per_request
      concurrency_and_stale_state:
