[project]
name = "settleiq-agent"
version = "0.1.0"
description = "SettleIQ investigation agent: no database access, tools only"
requires-python = ">=3.12,<3.13"
# Database drivers and backend code must never join these.
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "openai>=1.60",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20"]
