# Internal-merchant write adapter (spec 4.4.1). Registered separately from the PostgreSQL
# read source, so registering that source grants no write authority. Frozen under task 1.6.

# TODO(G5 5.5 Rahul): the adapter behind these two capabilities (spec 4.4.1). The correction is
# a conditional UPDATE ... WHERE status = expected_current_status on exactly one tenant-scoped
# row, run as a restricted merchant role that can update only that status column. Zero or
# several matches, stale state, another tenant's row or any transition other than
# PENDING -> COMPLETED fails closed with no mutation (AC-MERCH-02..04). Map the idempotency key
# to one durable action record: same payload returns the original outcome, a different one is
# refused (AC-MERCH-05). No caller value reaches SQL text (AC-MERCH-06). Register a health
# check, and keep merchant.payment.read read-only for preconditions and readback.
connector_id: internal-merchant
version: 1.0.0
protocols: [postgresql]
source_types: [merchant_database]
auth_mode: database_role
secret_reference_required: true

supports_discovery: false
supports_metadata: false
supports_batch_extraction: false
supports_incremental: false
supports_events: false
supports_file_ingestion: false
supports_detail_lookup: true

extraction_modes: []
capabilities:
  - key: merchant.payment.read
    version: 1.0.0
    parameters:
      type: object
      additionalProperties: false
      required: [tenant_id, payment_id]
      properties:
        tenant_id: {type: string, format: uuid}
        payment_id: {type: string}
  - key: merchant.payment_status.correct
    version: 1.0.0
    parameters:
      type: object
      additionalProperties: false
      required: [tenant_id, payment_id, expected_current_status, requested_status]
      properties:
        tenant_id: {type: string, format: uuid}
        payment_id: {type: string}
        expected_current_status: {const: PENDING}
        requested_status: {const: COMPLETED}

rate_limit: {status: not_applicable}
retry:
  retry_on: [network]
  honour_retry_after: false
  backoff: exponential
  max_attempts: 3
  actions: idempotency_key_only
supported_schema_versions: []
health_signals: [database_connection]
limits: {}
