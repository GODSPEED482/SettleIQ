# Production stack on the EC2 host. docker-compose.yml at the repo root is the local stack.
#
# Fixed project name: every release directory must drive the SAME containers/volumes.
#
# Values from .env are interpolated per service rather than passed with env_file, so each
# secret reaches only the services that need it. The agent must never join `backend`.
# Only `proxy` publishes ports; worker and agent-tools stay private (AC-AUTHZ-17, spec 8.2).
name: settleiq

x-app: &app
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-python: &python
  <<: *app
  user: "10001:10001"

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://settleiq_app:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
  ENVIRONMENT: ${ENVIRONMENT}
  RAW_EVIDENCE_DIR: /data/raw-evidence
  SOURCE_SECRET_DIR: /run/source-secrets

services:
  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /data/caddy:/data # certs survive redeploys -> no Let's Encrypt rate-limit lockout
    depends_on:
      - api
      - web
    networks: [edge]

  web:
    <<: *app
    image: ${REGISTRY}/settleiq-web:${TAG}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [edge]

  api:
    <<: *python
    image: ${REGISTRY}/settleiq-api:${TAG}
    # Caddy is the only peer that can reach this port, so its forwarded headers are trusted.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      <<: *backend-env
      APP_BASE_URL: ${APP_BASE_URL:-https://app.settleiq.dpdns.org}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Seals credentials from the write-only intake (spec v1.7 §11.3). Unset closes the intake.
      SOURCE_SECRET_KEY: ${SOURCE_SECRET_KEY:-}
    volumes:
      - /data/raw-evidence:/data/raw-evidence
      - ./source-secrets:/run/source-secrets:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    networks: [edge, backend]

  worker:
    <<: *python
    image: ${REGISTRY}/settleiq-api:${TAG}
    command: ["uvicorn", "app.worker_api:app", "--host", "0.0.0.0", "--port", "8001"]
    environment: *backend-env
    volumes:
      - /data/raw-evidence:/data/raw-evidence
      - ./source-secrets:/run/source-secrets:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), 2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    networks: [backend]

  # Drains the webhook inbox apart from receipt and starts the reconciliation runs PayPal
  # events trigger (task 4.4, AC-PP-05). No port.
  webhooks:
    <<: *python
    image: ${REGISTRY}/settleiq-api:${TAG}
    command: ["python", "-m", "app.webhooks.run"]
    environment: *backend-env
    volumes:
      - /data/raw-evidence:/data/raw-evidence
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  # Ontology generation and investigations need these. Enable them with COMPOSE_PROFILES=agent
  # in SSM.
  agent-tools:
    <<: *python
    profiles: [agent]
    image: ${REGISTRY}/settleiq-api:${TAG}
    command: ["uvicorn", "app.agent_tools_api:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      <<: *backend-env
      AGENT_TOKEN_SECRET: ${AGENT_TOKEN_SECRET:-}
    volumes:
      # get_case_evidence reads hash-checked raw excerpts; it never writes evidence.
      - /data/raw-evidence:/data/raw-evidence:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8002), 2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    networks: [backend, agent]

  dispatcher:
    <<: *python
    profiles: [agent]
    image: ${REGISTRY}/settleiq-api:${TAG}
    command: ["python", "-m", "app.investigation.dispatcher"]
    environment:
      DATABASE_URL: postgresql+psycopg://settleiq_dispatcher:${DISPATCHER_DB_PASSWORD:-}@db:5432/${POSTGRES_DB}
      ENVIRONMENT: ${ENVIRONMENT}
      AGENT_TOKEN_SECRET: ${AGENT_TOKEN_SECRET:-}
      AGENT_URL: http://agent:8100
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, agent]

  agent:
    <<: *python
    profiles: [agent]
    image: ${REGISTRY}/settleiq-agent:${TAG}
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      AGENT_TOOLS_URL: http://agent-tools:8002
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8100), 2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    networks: [agent]

  # The only container with the Docker socket (spec 9.7.6, AC-REL-09). It tells api and worker
  # the registry digest of their own container, by their network address; nothing they send can
  # change the answer. No port is published, and it shares only the backend network.
  runtime-identity:
    <<: *app
    image: python:3.12-alpine
    command: ["python", "/srv/server.py"]
    read_only: true
    volumes:
      - ./runtime-identity/server.py:/srv/server.py:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [backend]

  migrate:
    <<: *python
    image: ${REGISTRY}/settleiq-api:${TAG}
    command: ["sh", "-c", "alembic upgrade head && python -m app.authz.seed"]
    restart: "no"
    profiles: ["tools"] # only runs via `docker compose run --rm migrate`
    environment:
      <<: *backend-env
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      DISPATCHER_DB_PASSWORD: ${DISPATCHER_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /data/postgres:/var/lib/postgresql/data # on the separate EBS volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

networks:
  edge:
  backend:
  agent:
