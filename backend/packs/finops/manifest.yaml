# Financial Operations pack manifest (spec 4.5). Contents fill in during G2 and G3.

namespace: finops
package: finops
version: 0.2.0
compatible_platform_versions: ">=0.1.0,<1.0.0"
dependencies: []
conflicts: []
ontology_definitions:
  - {id: finops.ontology, path: ontology/finops.jsonld}
shacl_shapes:
  - {id: finops.shapes, path: ontology/finops.shacl.ttl}
# PayPal bindings and authority (task 4.6, spec 10.5 step 4). A tenant applies these to a draft
# for its own source (app/semantics/mappings.py:hint_bodies), then validates and publishes them.
# A webhook event and a captures.read response bind the same capture properties with the same
# meaning, so either is comparable with the merchant's row and a disagreement raises
# STATUS_MISMATCH (AC-PP-06). PayPal is the authority for capture and refund completion; the
# merchant database is the authority for internal order and payment state. Merchant bindings are
# not hinted: every merchant schema differs, and discovery proposes them (task 2.2).
# update_time is not bound: finops has no term for it, and each record's own observed time
# already orders observations of one property.
mapping_hints:
  - kind: binding
    connector_id: paypal
    external_object: captures.read
    class_iri: finops:Capture
    sync_strategy: batch
    fields: &api_fields
      - &capture_id {field_path: $.id, property_iri: finops:providerReference, datatype: string,
          transform: {name: identity}, value_basis: identifier, temporal_context: any}
      - &order_ref {field_path: $.invoice_id, property_iri: finops:orderReference,
          datatype: string, transform: {name: identity}, value_basis: identifier,
          temporal_context: any}
      - &status {field_path: $.status, property_iri: finops:lifecycleStatus, datatype: string,
          transform: {name: upper}, value_basis: status, temporal_context: current}
      - &amount {field_path: $.amount.value, property_iri: finops:amount, datatype: decimal,
          transform: {name: decimal_string}, value_basis: signed, temporal_context: at_event,
          currency_field: $.amount.currency_code}
      - &created {field_path: $.create_time, property_iri: finops:occurredAt,
          datatype: datetime, transform: {name: iso8601}, value_basis: timestamp,
          temporal_context: at_event}
  - kind: binding
    connector_id: paypal
    external_object: refunds.read
    class_iri: finops:Refund
    sync_strategy: batch
    fields: *api_fields
  # The same fields inside a webhook event, whose resource is the capture or refund.
  - kind: binding
    connector_id: paypal
    external_object: PAYMENT.CAPTURE.COMPLETED
    class_iri: finops:Capture
    sync_strategy: event
    fields: &event_fields
      - {<<: *capture_id, field_path: $.resource.id}
      - {<<: *order_ref, field_path: $.resource.invoice_id}
      - {<<: *status, field_path: $.resource.status}
      - {<<: *amount, field_path: $.resource.amount.value,
          currency_field: $.resource.amount.currency_code}
      - {<<: *created, field_path: $.resource.create_time}
  - kind: binding
    connector_id: paypal
    external_object: PAYMENT.CAPTURE.PENDING
    class_iri: finops:Capture
    sync_strategy: event
    fields: *event_fields
  - kind: binding
    connector_id: paypal
    external_object: PAYMENT.CAPTURE.DENIED
    class_iri: finops:Capture
    sync_strategy: event
    fields: *event_fields
  - kind: binding
    connector_id: paypal
    external_object: PAYMENT.CAPTURE.REFUNDED
    class_iri: finops:Refund
    sync_strategy: event
    fields: *event_fields
  - kind: authority
    connector_id: paypal
    property_iri: finops:lifecycleStatus
    entity_type_iri: finops:Capture
    verification_method: PayPal capture status from a verified webhook or captures.read
  - kind: authority
    connector_id: paypal
    property_iri: finops:amount
    entity_type_iri: finops:Capture
    verification_method: PayPal capture amount from a verified webhook or captures.read
  - kind: authority
    connector_id: paypal
    property_iri: finops:lifecycleStatus
    entity_type_iri: finops:Refund
    verification_method: PayPal refund status from a verified webhook or refunds.read
  - kind: authority
    connector_id: paypal
    property_iri: finops:amount
    entity_type_iri: finops:Refund
    verification_method: PayPal refund amount from a verified webhook or refunds.read
  - kind: authority
    connector_id: merchant-postgres
    property_iri: finops:lifecycleStatus
    entity_type_iri: finops:Order
    verification_method: Merchant order state read from the merchant database
  - kind: authority
    connector_id: merchant-postgres
    property_iri: finops:lifecycleStatus
    entity_type_iri: finops:Payment
    verification_method: Merchant payment state read from the merchant database
validators:
  - {id: finops.settlement_cardinality, entrypoint: "packs.finops.validators:check_settlement_cardinality"}
  - {id: finops.required_terms, entrypoint: "packs.finops.validators:check_required_terms"}
# The exact-ID policy is data in resolution.yaml; the entrypoint only returns it.
entity_resolution_policies:
  - {id: finops.exact_id, entrypoint: "packs.finops.resolution:exact_id_policy"}
# Both reconciliation scopes, the OPEN-10 settlement calculation and duplicate captures.
domain_engine: {id: finops.engine, entrypoint: "packs.finops.engine:run"}

case_types:
  - {code: TXN_MISSING, default_severity: high}
  - {code: STATUS_MISMATCH, default_severity: high}
  - {code: AMOUNT_MISMATCH, default_severity: high}
  - {code: DUPLICATE_CAPTURE, default_severity: critical}
  - {code: REFUND_MISMATCH, default_severity: high}
  - {code: FEE_MISMATCH, default_severity: medium}
  - {code: SETTLEMENT_VARIANCE, default_severity: high}
  - {code: UNMATCHED_BANK_CREDIT, default_severity: medium}
  - {code: LEDGER_MISMATCH, default_severity: medium}

agent_tools:
  - {name: calculate_settlement_variance, permission: domain.compute}

permissions: []

connector_action_capabilities:
  - merchant.payment_status.correct
  - refunds.create

playbook_templates:
  # TODO(G5 5.9 Swapnaneel): the PB-001 definition (spec 9.1, 9.2): trigger STATUS_MISMATCH,
  # required evidence (PayPal capture authoritatively COMPLETED from a verified event or
  # captures.read, merchant payment PENDING, amount, currency and order agreeing), the single
  # PENDING -> COMPLETED transition, approval policy from tenant data (REQUIRED for the demo),
  # idempotency strategy, failure path and verification by merchant.payment.read. Follows
  # spec 4.4.1, not "replay the event".
  - id: PB-001
    title: Payment-state recovery
    executable: true
    definition: null
    connector_action_capabilities: [merchant.payment_status.correct]
    capability_dependencies: [merchant.payment.read]
  # TODO(G5 5.13 Swapnaneel): the PB-002 definition and its recommendation: two distinct
  # successful captures for one intended order, original versus duplicate identified, currency
  # and amount verified, no existing refund on the target and no pending dispute or hold.
  # Equal amounts alone are never proof (AC-PLY-02). Approval is always REQUIRED with an
  # approver other than the requester. Verification reads refunds.read and captures.read.
  - id: PB-002
    title: Duplicate-capture refund
    executable: true
    definition: null
    connector_action_capabilities: [refunds.create]
    capability_dependencies: [refunds.read, captures.read]
  - id: PB-003
    title: Settlement / chargeback workflow
    executable: false

# The SYNTHETIC/REFERENCE BRR fixture (spec 10.3.1, task 3.8). Paths are relative to this pack.
test_fixtures:
  - fixtures/SYNTHETIC_REFERENCE_balance_report_v1.csv
  - fixtures/SYNTHETIC_REFERENCE_balance_report_v1.manifest.yaml
