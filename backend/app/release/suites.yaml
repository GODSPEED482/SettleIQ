        - tests/test_worker_refunds.py::test_an_original_that_changed_stops_the_refund
        - tests/test_pb002.py::test_a_prior_refund_on_the_order_makes_pb002_ineligible
        - tests/test_worker.py::test_concurrent_runs_consume_the_grant_once
        - tests/test_worker.py::test_a_grant_runs_once
