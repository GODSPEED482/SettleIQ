name: CI

on:
  push:
    branches: [prod]
  pull_request:
  workflow_call: # deploy.yml reuses this as its gate

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: settleiq
          POSTGRES_USER: settleiq_owner
          POSTGRES_PASSWORD: ci-owner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U settleiq_owner -d settleiq"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://settleiq_app:ci-app@localhost:5432/settleiq
      MIGRATION_DATABASE_URL: postgresql+psycopg://settleiq_owner:ci-owner@localhost:5432/settleiq
      APP_DB_PASSWORD: ci-app
      # An unreachable database fails the run, so isolation tests cannot be skipped.
      REQUIRE_DB_TESTS: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run alembic upgrade head
      - run: uv run python -m app.authz.seed
      - run: uv run pytest
      - run: uv run python -m app.route_map > route-map.json
      - uses: actions/upload-artifact@v4
        with:
          name: route-map
          path: backend/route-map.json

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  images:
    # Catches broken Dockerfiles on the PR instead of at deploy time.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            context: backend
            file: backend/Dockerfile
          - service: web
            context: frontend
            file: frontend/Dockerfile.prod
          - service: agent
            context: agent
            file: agent/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-config:
    # No AWS credentials: the infra role cannot be assumed from a PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/bootstrap init -backend=false -input=false
      - run: terraform -chdir=infra/bootstrap validate
      - run: terraform -chdir=infra/envs/prod init -backend=false -input=false
      - run: terraform -chdir=infra/envs/prod validate
      - run: shellcheck deploy/deploy.sh
