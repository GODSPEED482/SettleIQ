[project]
name = "kitebase-demo-business"
version = "0.1.0"
description = "Kitebase, a fictional SaaS business that SettleIQ's demo reconciles (tasks 6.11 to 6.14)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20"]
# FastAPI's Depends() and Form() defaults are the framework idiom.
ignore = ["B008"]
