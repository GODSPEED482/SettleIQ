name: deploy

# Runs only for a push to prod, which includes a merged PR. Keep it that way: do not add
# workflow_dispatch or pull_request, since those can run from other branches. The AWS deploy
# role enforces the same rule (it trusts only refs/heads/prod). Rollback is in docs/DEPLOYMENT.md.
on:
  push:
    branches: [prod]
    paths-ignore:
      - "infra/**"
      - "docs/**"
      - "**/*.md"

concurrency:
  group: deploy-prod
  cancel-in-progress: false # never kill a deploy halfway

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  test:
    if: github.ref == 'refs/heads/prod'
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC -> AWS, no long-lived keys
      contents: read
    strategy:
      matrix:
        include:
          - service: api
            context: backend
            file: backend/Dockerfile
          - service: web
            context: frontend
            file: frontend/Dockerfile.prod
          - service: agent
            context: agent
            file: agent/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          provenance: false # a single manifest per tag, so ECR lifecycle counts stay accurate
          tags: ${{ steps.ecr.outputs.registry }}/settleiq-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      TAG: ${{ github.sha }}
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload release bundle
        run: aws s3 cp deploy/ "s3://$RELEASE_BUCKET/releases/$TAG/" --recursive

      - name: Run deploy.sh on the host via SSM
        run: |
          jq -n --arg b "$RELEASE_BUCKET" --arg t "$TAG" '{
            commands: ["aws s3 cp s3://\($b)/releases/\($t)/ /opt/settleiq/releases/\($t)/ --recursive && bash /opt/settleiq/releases/\($t)/deploy.sh \($t)"],
            executionTimeout: ["900"]
          }' > params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $TAG" \
            --parameters file://params.json \
            --query Command.CommandId --output text)

          # `aws ssm wait command-executed` gives up after ~100s; deploys can take longer
          for _ in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text >&2
          echo "SSM status: $STATUS"
          test "$STATUS" = "Success"

      - name: Smoke test through the public URL
        run: |
          for _ in $(seq 1 10); do
            if curl -fsS "https://$APP_DOMAIN/healthz"; then exit 0; fi
            sleep 6
          done
          echo "health check failed - see the rollback section of docs/DEPLOYMENT.md"
          exit 1
