# PayPal Sandbox adapter (spec 10). Rate limits, retries and limits were checked against
# PayPal's developer documentation on 2026-11-10 (OPEN-PP-01); README.md lists the sources.
# The manifest shape is frozen under task 1.6 (OPEN-01, OPEN-CAP-01).

# TODO(G4 4.1 Rahul): with the Sandbox app, confirm the token scopes include Transaction
# Search and refunds, register the webhook, and record whether Sandbox SFTP reports are enabled.
# Expose the webhook route on a public HTTPS URL (a tunnel or the production domain) and
# confirm PayPal reaches it. Record the outcome under OPEN-PP-01 in README.md.
# TODO(G4 4.2 Rahul): freeze this adapter manifest against what 4.1 found: fill
# supported_schema_versions, and declare incremental reads only if they are built.
# TODO(G4 4.9 Rahul): in Sandbox, create one intended order with two distinct successful
# capture IDs (spec 10.6, demo step 14). Record both IDs, the order linkage and the event
# details that prove the duplicate; equal amounts alone are not proof (AC-PLY-02).
connector_id: paypal
version: 1.0.0
protocols: [https-rest, webhook, csv]
source_types: [payment_provider]
auth_mode: oauth2_client_credentials
secret_reference_required: true

supports_discovery: false
supports_metadata: false
supports_batch_extraction: true
supports_incremental: false
supports_events: true
supports_file_ingestion: true
supports_detail_lookup: true

extraction_modes: [backfill]
capabilities:
  - key: transactions.read
    version: 1.0.0
    parameters:
      type: object
      additionalProperties: false
      required: [start_time, end_time]
      properties:
        start_time: {type: string, format: date-time}
        end_time: {type: string, format: date-time}
        page_token: {type: string}
  - key: captures.read
    version: 1.0.0
    parameters:
      type: object
      additionalProperties: false
      required: [capture_id]
      properties:
        capture_id: {type: string}
  - key: refunds.read
    version: 1.0.0
    parameters:
      type: object
      additionalProperties: false
      required: [refund_id]
      properties:
        refund_id: {type: string}
  # TODO(G4 4.10 Rahul): the refunds.create and refunds.read adapter calls. Refund only the
  # exact capture named, send idempotency_key as PayPal-Request-Id, and refuse any base URL
  # that is not Sandbox. A change to this parameter contract bumps the capability version. An
  # ambiguous outcome is settled by refunds.read, never by a blind retry (5.15). Only the
  # Worker calls the adapter, under a grant (5.6); no route reaches it.
  - key: refunds.create
    version: 1.0.0
    parameters:
      type: object
      additionalProperties: false
      required: [capture_id, amount, currency, idempotency_key]
      properties:
        capture_id: {type: string}
        amount: {type: string, pattern: '^[0-9]+\.[0-9]{2}$'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        idempotency_key: {type: string, minLength: 1}
  - key: webhooks.receive
    version: 1.0.0
    parameters: {}
  - key: reports.balance_reconciliation.read
    version: 1.0.0
    parameters: {}
  - key: files.upload
    version: 1.0.0
    parameters: {}
rate_limit:
  status: undisclosed
  guidance:
    - PayPal publishes no rate-limiting policy; exceeding it returns HTTP 429 RATE_LIMIT_REACHED.
    - Do not poll; use webhooks for event-driven updates.
    - Reuse the OAuth access token until expires_in; never request one per call.
# Our policy, not a PayPal guarantee: PayPal does not document Retry-After.
retry:
  retry_on: ["429", "5xx", network]
  honour_retry_after: true
  backoff: exponential
  max_attempts: 3
  actions: idempotency_key_only
supported_schema_versions: []
health_signals: [oauth_token, webhook_last_received]
limits:
  transactions.read: {max_range_days: 31, max_page_size: 500, availability_lag_hours: 3}
  webhooks.receive: {provider_redeliveries: 25, provider_redelivery_days: 3}
