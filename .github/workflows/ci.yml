name: CI

on:
  push:
    branches: [prod]
  pull_request:
  workflow_call: # deploy.yml reuses this as its gate

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: settleiq
          POSTGRES_USER: settleiq_owner
          POSTGRES_PASSWORD: ci-owner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U settleiq_owner -d settleiq"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://settleiq_app:ci-app@localhost:5432/settleiq
      MIGRATION_DATABASE_URL: postgresql+psycopg://settleiq_owner:ci-owner@localhost:5432/settleiq
      APP_DB_PASSWORD: ci-app
      DISPATCHER_DB_PASSWORD: ci-dispatcher
      # An unreachable database fails the run, so isolation tests cannot be skipped.
      REQUIRE_DB_TESTS: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run alembic upgrade head
      - run: uv run python -m app.authz.seed
      - run: uv run pytest
      - run: uv run python -m app.route_map > route-map.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: route-map
          path: backend/route-map.json

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  images:
    # Catches broken Dockerfiles on the PR instead of at deploy time.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            context: backend
            file: backend/Dockerfile
          - service: web
            context: frontend
            file: frontend/Dockerfile.prod
          - service: agent
            context: agent
            file: agent/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-config:
    # No AWS credentials: the infra role cannot be assumed from a PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/bootstrap init -backend=false -input=false
      - run: terraform -chdir=infra/bootstrap validate
      - run: terraform -chdir=infra/envs/prod init -backend=false -input=false
      - run: terraform -chdir=infra/envs/prod validate
      - run: shellcheck deploy/deploy.sh infra/push-prod-env.sh
