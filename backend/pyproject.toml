[project]
name = "settleiq-backend"
version = "0.1.0"
description = "SettleIQ API, worker and domain packs"
requires-python = ">=3.12,<3.13"
# TODO(G1 1.9 Swapnaneel): add the maintained auth library chosen under spec 11.2.
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyshacl>=0.26",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.35",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["db: needs PostgreSQL migrated and seeded (see tests/conftest.py)"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20"]
# FastAPI's Depends() defaults are the framework idiom.
ignore = ["B008"]

[tool.ruff.lint.isort]
# The local alembic/ directory would otherwise be mistaken for first-party code.
known-third-party = ["alembic"]
